<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/prediksi.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <!-- responsive.css HARUS dimuat PALING TERAKHIR agar override mobile-nya
         tidak ditimpa balik oleh topbar.css / footer.css yang dimuat sesudahnya -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body>

<!-- =====================================================
     TOMBOL HAMBURGER MOBILE
     Selalu dirender di semua halaman (termasuk Prediksi,
     yang topbar-nya disembunyikan) supaya sidebar tetap
     bisa dibuka dari halaman mana pun di layar kecil.
     Disembunyikan lewat CSS di layar desktop.
====================================================== -->
<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka menu" aria-expanded="false">
    <i class="bi bi-list"></i>
</button>

<!-- Backdrop gelap di belakang sidebar saat menu mobile terbuka -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="wrapper">

    {% include 'components/sidebar.html' %}

    <div class="main-content">

        {% if request.endpoint != 'prediksi' %}
            {% include 'components/topbar.html' %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

{% block scripts %}{% endblock %}

</body>
</html>
